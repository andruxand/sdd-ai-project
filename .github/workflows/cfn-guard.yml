name: CloudFormation Guard
on:
  pull_request:
    paths:
      - 'infra/**'
jobs:
  cfn-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for templates and rules
        id: check
        run: |
          templates=$(find infra/ -name '*.yaml' -o -name '*.yml' -o -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          rules=$(find infra/ -name '*.guard' 2>/dev/null | wc -l | tr -d ' ')
          echo "ready=$([[ $templates -gt 0 && $rules -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Install cfn-guard
        if: steps.check.outputs.ready == 'true'
        run: |
          curl -fsSL https://github.com/aws-cloudformation/cloudformation-guard/releases/latest/download/cfn-guard-v3-ubuntu-latest.tar.gz -o cfn-guard.tar.gz
          tar xzf cfn-guard.tar.gz
          chmod +x cfn-guard
          sudo mv cfn-guard /usr/local/bin/
      - name: Run cfn-guard
        if: steps.check.outputs.ready == 'true'
        run: cfn-guard validate --data infra/ --rules infra/
      - name: Not ready
        if: steps.check.outputs.ready != 'true'
        run: echo "No CloudFormation templates or guard rules in infra/ — skipping."
