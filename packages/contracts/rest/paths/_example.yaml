# Example domain paths — copy and adapt for your bounded context.
#
# Reference from openapi.yaml:
#   /orders:
#     $ref: './paths/orders.yaml#/~1orders'
#   /orders/{orderId}:
#     $ref: './paths/orders.yaml#/~1orders~1{orderId}'

/orders:
  get:
    operationId: listOrders
    summary: List orders
    description: Returns a paginated list of orders.
    tags:
      - Orders
    parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
          maximum: 100
        description: Maximum number of results to return.
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: Pagination cursor from a previous response.
    responses:
      '200':
        description: A list of orders.
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '../components/_example.yaml#/Order'
                nextCursor:
                  type: string
                  nullable: true

/orders/{orderId}:
  get:
    operationId: getOrder
    summary: Get order by ID
    description: Returns a single order by its ID.
    tags:
      - Orders
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
        description: Unique order identifier.
    responses:
      '200':
        description: The order.
        content:
          application/json:
            schema:
              $ref: '../components/_example.yaml#/Order'
      '404':
        description: Order not found.
