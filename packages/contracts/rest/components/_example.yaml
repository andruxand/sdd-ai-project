# Example shared components — copy and adapt for your domain schemas.
#
# Reference from openapi.yaml:
#   components:
#     schemas:
#       Order:
#         $ref: './components/orders.yaml#/Order'
#
# Reference from paths:
#   $ref: '../components/orders.yaml#/Order'

Order:
  type: object
  required:
    - id
    - status
    - createdAt
  properties:
    id:
      type: string
      description: Unique order identifier.
      example: ord_abc123
    status:
      type: string
      enum: [pending, confirmed, shipped, delivered, cancelled]
      description: Current order status.
    createdAt:
      type: string
      format: date-time
      description: ISO 8601 timestamp of order creation.
    updatedAt:
      type: string
      format: date-time
      description: ISO 8601 timestamp of last update.
      nullable: true
